# Supabase Configuration
# This file configures Supabase Edge Functions

[functions.notify-booking-confirmed]
# Desactivar verificación JWT para esta función
# Esto permite que se llame sin autenticación (útil cuando Supabase bloquea las llamadas)
# NOTA: La función usa SERVICE_ROLE_KEY internamente, así que es segura
verify_jwt = false

[functions.notify-booking-requested]
# También desactivamos la verificación JWT para esta función
# La función usa SERVICE_ROLE_KEY y solo crea notificaciones / envía push
verify_jwt = false

[functions.notify-user-registered]
# Permitir llamadas desde el frontend sin JWT (usa SERVICE_ROLE_KEY internamente)
verify_jwt = false

[functions.delete-user-completely]
# Permitir que el panel de administración llame a esta función directamente
# (la función usa SERVICE_ROLE_KEY internamente para borrar en auth.users)
verify_jwt = false

[functions.notify-week-unlocked]
# Permitir llamadas desde el frontend sin JWT (usa SERVICE_ROLE_KEY internamente)
verify_jwt = false

[functions.notify-booking-cancelled]
# Notificar a admins cuando un usuario cancela una reserva confirmada
verify_jwt = false
